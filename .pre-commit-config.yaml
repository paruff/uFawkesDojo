# Pre-commit hooks for uFawkes product suite repos
# Install: pre-commit install && pre-commit install --hook-type commit-msg
# Run: pre-commit run --all-files
# Hook versions managed by Renovate (see uFawkesPipe renovate.json)
# Do not edit versions here — update the Renovate config instead

exclude: ^\.git/|^\.github/|^\.vscode/|^\.idea/|^node_modules/|
  ^\.serena/|^\.opencode/|^\.claude/

repos:
  # General file hygiene — runs on every file type
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # Python: ruff linter + formatter (replaces flake8, black, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # YAML linting — uses repo-root .yamllint config
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]
        types: [yaml]

  # Markdown linting — uses repo-root .markdownlint.json config
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json", "--fix"]

  # Secret scanning — uses repo-root .gitleaks.toml config
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  # Local hooks: Conventional Commits validator (commit-msg stage)
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commits validation
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true
