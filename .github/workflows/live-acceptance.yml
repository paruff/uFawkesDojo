# SPDX-License-Identifier: Apache-2.0
# Live Acceptance (Nightly) — uFawkesDojo's entry for uFawkes.dev's
# docs/ai-sdlc/suite-release/live-checks.yml.
#
# For every published lab whose self-check runs against the stack itself:
# boot a real uFawkesObs stack on a clean runner (the setup half of the lab),
# then run that lab's own validate.sh against it. Any red self-check fails
# the run — a lab that rots when the stack it targets changes turns this
# workflow red instead of rotting quietly.
#
# Stack-only tier (#73): Brown Belt 15 and 16 run `validate.sh --stack-only`.
# That checks the stack and, for BB15, the metric the SLIs are built on, and
# skips what the student creates (rules, alerts, dashboard, postmortem). It
# catches stack rot in those labs; it is NOT a lab pass. Their table rows say
# "stack-only".
#
# White Belt 01/03/04 run on uFawkesDevX: one job boots it at the pinned tag,
# scripts the student half (scripts/run-devx-labs.sh) and runs their validate.sh.
#
# Deliberately NOT wired here (not silently skipped): Yellow Belt 05-08, which
# target uFawkesPipe and verify student artifacts (pipelines, repos). Their
# checks cannot pass on a clean runner without scripting the whole lab flow —
# see #73 and docs/live-checks.md.
name: Live Acceptance (Nightly)

on:
  schedule:
    # 02:00 UTC daily — catches stack-side changes overnight.
    - cron: '0 2 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: live-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AC-006: every stack tag a lab names must exist. Labs that say they are
  # ahead of their stack ("not released yet") warn instead of failing.
  lab-pins:
    name: Every tag, make target and port a lab names exists
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: job-start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Check out uFawkesDojo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-lab-pins.sh
      # AC-008: every make target and localhost port a lab names exists in its pinned tag.
      - run: scripts/check-lab-commands.sh

      - name: job-finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  white-belt-m02-lab-01:
    name: White Belt M02 Lab 01 — See DORA Metrics Live
    uses: ./.github/workflows/_lab-acceptance.yml
    with:
      lab_name: White Belt M02 Lab 01 — See DORA Metrics Live
      validate_path: white-belt/module-02-dora-metrics/lab-01/validate.sh
      # This self-check reads Grafana credentials from ./.env beside the stack.
      run_from: stack
      make_target: up-dora
      artifact_name: wb-m02-lab-01

  white-belt-m02-lab-02:
    name: White Belt M02 Lab 02 — Emit and See It in Grafana
    uses: ./.github/workflows/_lab-acceptance.yml
    with:
      lab_name: White Belt M02 Lab 02 — Emit and See It in Grafana
      validate_path: white-belt/module-02-dora-metrics/lab-02/validate.sh
      make_target: up-dora
      needs_ai: true
      artifact_name: wb-m02-lab-02

  brown-belt-m13-lab-01:
    name: Brown Belt M13 Lab 01 — Observability Stack
    uses: ./.github/workflows/_lab-acceptance.yml
    with:
      lab_name: Brown Belt M13 Lab 01 — Observability Stack
      validate_path: brown-belt/module-13-observability/lab-01/validate.sh
      # Tempo trace checks need the telemetry generator (apps profile).
      make_target: up-full
      telemetry: true
      artifact_name: bb-m13-lab-01

  brown-belt-m14-lab-01:
    name: Brown Belt M14 Lab 01 — DORA Metrics Deep Dive
    uses: ./.github/workflows/_lab-acceptance.yml
    with:
      lab_name: Brown Belt M14 Lab 01 — DORA Metrics Deep Dive
      validate_path: brown-belt/module-14-dora-deep-dive/lab-01/validate.sh
      make_target: up-dora
      artifact_name: bb-m14-lab-01

  brown-belt-m15-lab-01:
    name: Brown Belt M15 Lab 01 — SLIs and SLOs (stack-only)
    uses: ./.github/workflows/_lab-acceptance.yml
    with:
      lab_name: Brown Belt M15 Lab 01 — SLIs and SLOs (stack-only)
      validate_path: brown-belt/module-15-slis-slos/lab-01/validate.sh
      validate_args: --stack-only
      make_target: up-dora
      artifact_name: bb-m15-lab-01

  brown-belt-m16-lab-01:
    name: Brown Belt M16 Lab 01 — Incident Management (stack-only)
    uses: ./.github/workflows/_lab-acceptance.yml
    with:
      lab_name: Brown Belt M16 Lab 01 — Incident Management (stack-only)
      validate_path: brown-belt/module-16-incident-management/lab-01/validate.sh
      validate_args: --stack-only
      make_target: up-dora
      artifact_name: bb-m16-lab-01

  # White Belt 1, 3 and 4 share one stack: uFawkesDevX at the tag Lab 1 pins.
  # The job does the labs' setup half (clone, .env, build, up), scripts the
  # student half (scripts/run-devx-labs.sh) and runs each lab's validate.sh.
  white-belt-devx-labs:
    name: White Belt M01, M03, M04 Labs — uFawkesDevX
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: job-start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Check out uFawkesDojo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the tag Lab 1 pins
        id: pin
        run: echo "tag=$(scripts/check-lab-pins.sh --print white-belt/module-01-what-is-idp/lab-01/instructions.md uFawkesDevX)" >> "$GITHUB_OUTPUT"

      - name: Check out uFawkesDevX at that tag, where the labs say
        run: |
          mkdir -p ~/dojo-labs
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/paruff/uFawkesDevX.git ~/dojo-labs/uFawkesDevX

      - name: Start the stack (Lab 1, Steps 1-2)
        working-directory: ~/dojo-labs/uFawkesDevX
        run: |
          make network
          cp .env.example .env
          gid=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock alpine stat -c %g /var/run/docker.sock)
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=${gid}/" .env
          sed -i "s#^CODER_ACCESS_URL=.*#CODER_ACCESS_URL=http://$(hostname -I | awk '{print $1}'):7080#" .env
          # The Backstage bundle, built in a container as the lab's Step 2 describes
          docker run --rm -v "$PWD/backstage:/w" -w /w node:24 sh -c \
            'node .yarn/releases/yarn-4.13.0.cjs install --immutable && node .yarn/releases/yarn-4.13.0.cjs tsc && node .yarn/releases/yarn-4.13.0.cjs build:backend'
          make build && make up
          make status

      - name: Install cookiecutter and run the labs
        run: |
          pipx install cookiecutter
          scripts/run-devx-labs.sh

      - name: Stack logs on failure
        if: failure()
        working-directory: ~/dojo-labs/uFawkesDevX
        run: docker compose logs --no-color --tail 200

      - name: job-finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  summary:
    name: Live Acceptance Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Presentation only: the lab jobs fail on their own, which is what turns
    # the run red — this just writes the per-lab table for the run page.
    if: always()
    needs:
      - white-belt-m02-lab-01
      - white-belt-m02-lab-02
      - brown-belt-m13-lab-01
      - brown-belt-m14-lab-01
      - brown-belt-m15-lab-01
      - brown-belt-m16-lab-01
      - white-belt-devx-labs
    steps:
      - name: job-start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Write per-lab result table
        env:
          WB01: ${{ needs.white-belt-m02-lab-01.result }}
          WB02: ${{ needs.white-belt-m02-lab-02.result }}
          BB13: ${{ needs.brown-belt-m13-lab-01.result }}
          BB14: ${{ needs.brown-belt-m14-lab-01.result }}
          BB15: ${{ needs.brown-belt-m15-lab-01.result }}
          BB16: ${{ needs.brown-belt-m16-lab-01.result }}
          WBDX: ${{ needs.white-belt-devx-labs.result }}
        run: |
          {
            echo "## Live Acceptance (Nightly)"
            echo
            echo "Each lab ran its own self-check against a real stack on a clean runner."
            echo
            echo "| Lab | Self-check result |"
            echo "| --- | ----------------- |"
            echo "| White Belt M02 Lab 01 — See DORA Metrics Live | ${WB01} |"
            echo "| White Belt M02 Lab 02 — Emit and See It in Grafana | ${WB02} |"
            echo "| Brown Belt M13 Lab 01 — Observability Stack | ${BB13} |"
            echo "| Brown Belt M14 Lab 01 — DORA Metrics Deep Dive | ${BB14} |"
            echo "| Brown Belt M15 Lab 01 — SLIs and SLOs (stack-only) | ${BB15} |"
            echo "| Brown Belt M16 Lab 01 — Incident Management (stack-only) | ${BB16} |"
            echo "| White Belt M01, M03, M04 Labs — uFawkesDevX | ${WBDX} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: job-finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
