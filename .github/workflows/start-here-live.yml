# SPDX-License-Identifier: Apache-2.0
# Start Here (Live) — runs White Belt Module 0 Lab 01 ("Start here") exactly
# as written, on a clean runner with Docker: every ```bash block of its
# instructions.md, in order, through scripts/run-lab-instructions.sh. That
# includes `devcontainer up` on the pinned fawkes-space image, the template's
# setup.sh inside it, and the lab's own validate.sh at the end.
#
# Unlike live-acceptance.yml, which runs only a lab's self-check against a
# booted stack, this runs the student's steps themselves, so an instruction
# that stops working turns this red.
name: Start Here (Live)

on:
  push:
    paths:
      - white-belt/module-00-vibe-coding-to-agentic/lab-01/**
      - scripts/run-lab-instructions.sh
      - .github/workflows/start-here-live.yml
  schedule:
    # 03:00 UTC daily, after live-acceptance.yml's 02:00 run.
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: start-here-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-here:
    name: White Belt M00 Lab 01 — Start here, run verbatim
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out uFawkesDojo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the devcontainer CLI (the lab's "Tools required")
        run: npm install -g @devcontainers/cli@0.89.0

      - name: Give git an identity (a student's machine has one)
        run: |
          git config --global user.name "Dojo Live Check"
          git config --global user.email "dojo-live-check@users.noreply.github.com"

      - name: Run the lab's instructions verbatim
        run: |
          set -o pipefail
          bash scripts/run-lab-instructions.sh \
            white-belt/module-00-vibe-coding-to-agentic/lab-01/instructions.md \
            2>&1 | tee start-here-transcript.txt

      - name: Put the transcript's ending on the run page
        if: always()
        run: |
          [ -f start-here-transcript.txt ] || { echo "no transcript was written"; exit 0; }
          tail_text="$(sed -E 's/\x1b\[[0-9;]*m//g' start-here-transcript.txt | grep -v '^+ ' | tail -40)"
          tail_text="${tail_text//'%'/'%25'}"
          tail_text="${tail_text//$'\r'/'%0D'}"
          tail_text="${tail_text//$'\n'/'%0A'}"
          echo "::notice title=Start here transcript (last 40 lines)::${tail_text}"

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: start-here-transcript
          path: start-here-transcript.txt
          if-no-files-found: warn
