name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log job start
        run: echo "job-start workflow=deploy-pages job=build sha=${{ github.sha }} time=$(date -u +%FT%TZ)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Log job finish
        if: always()
        run: echo "job-finish workflow=deploy-pages job=build sha=${{ github.sha }} time=$(date -u +%FT%TZ)"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Log job start
        run: echo "job-start workflow=deploy-pages job=deploy sha=${{ github.sha }} time=$(date -u +%FT%TZ)"

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Log job finish
        if: always()
        run: echo "job-finish workflow=deploy-pages job=deploy sha=${{ github.sha }} time=$(date -u +%FT%TZ)"
