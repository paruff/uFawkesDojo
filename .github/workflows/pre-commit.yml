name: Pre-commit

# Runs every hook in .pre-commit-config.yaml on all files, stage by stage, the
# same hooks a contributor runs locally with `pre-commit install`, through
# uFawkesPipe's reusable Pre-flight (pre-commit and pre-push stages, and each
# PR commit's message through the commit-msg hook). This replaces
# pre-commit.ci, which this repo no longer uses.

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner — hosted (default), or the MBP fallback during a hosted incident
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

# Pre-flight's job asks for pull-requests: read (to read the PR's size and
# commits); a called workflow can't have more than its caller grants, so a
# caller without it never starts (startup_failure).
permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    name: Pre-commit hooks
    uses: paruff/uFawkesPipe/.github/workflows/reusable-preflight.yml@c366d41b52754340fd7f88175d7cd270397e1713 # feat/reusable-runner-input (e2e test pin — this branch must not merge)
    with:
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      pr-size-limit: 0 # this repo had no PR size gate; Pre-flight's default is 400
      commit-format: conventional

  env-probe: # TEMP diagnostic on the test branch — delete with it
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Dump step env
        run: |
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-UNSET}"
          echo "HOME=$HOME"
          env | grep -E "^RUNNER_|^ImageOS" | sort
          mkdir -p "${RUNNER_TOOL_CACHE}/probe" && echo "mkdir into toolcache: OK"
