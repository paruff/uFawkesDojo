name: Markdown Lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner — hosted (default), or the MBP fallback during a hosted incident
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

jobs:
  markdownlint:
    # Only a manual dispatch can route to the MBP: push/PR runs stay on
    # GitHub-hosted runners, so fork-PR code never executes self-hosted.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: job-start
        run: echo "job-start workflow=markdown-lint job=markdownlint sha=${{ github.sha }} time=$(date -u +%FT%TZ)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: '**/*.md'
      - name: job-finish
        if: always()
        run: echo "job-finish workflow=markdown-lint job=markdownlint sha=${{ github.sha }} time=$(date -u +%FT%TZ)"
