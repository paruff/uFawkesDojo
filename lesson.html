<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fawkes Dojo - Lesson</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <style>
      :root {
        --page: #f9fafb;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #4b5563;
        --border: #e5e7eb;
        --link: #4f46e5;
        --code-bg: #f9fafb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #061723;
          --surface: #1f2937;
          --ink: #f9fafb;
          --muted: #e5e7eb;
          --border: #4b5563;
          --link: #a5b4fc;
          --code-bg: #061723;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--page);
        color: var(--ink);
        line-height: 1.6;
        min-height: 100vh;
      }

      a {
        color: var(--link);
      }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }

      .header {
        background: #061723;
        padding: 1.25rem 0;
        color: #ffffff;
      }

      .header .header-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .header a {
        color: #a5b4fc;
        text-decoration: none;
        font-weight: 600;
      }

      .header a:hover {
        text-decoration: underline;
      }

      .container {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
      }

      .lesson-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
      }

      .lesson-card :first-child {
        margin-top: 0;
      }

      .lesson-card h1,
      .lesson-card h2,
      .lesson-card h3 {
        color: var(--ink);
        margin: 1.5rem 0 0.75rem;
        line-height: 1.3;
      }

      .lesson-card h1 {
        font-size: 2rem;
      }
      .lesson-card h2 {
        font-size: 1.5rem;
      }
      .lesson-card h3 {
        font-size: 1.2rem;
      }

      .lesson-card p,
      .lesson-card li {
        margin-bottom: 0.5rem;
      }

      .lesson-card ul,
      .lesson-card ol {
        margin: 0 0 1rem 1.5rem;
      }

      .lesson-card pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-left: 4px solid #4f46e5;
        border-radius: 8px;
        padding: 1rem;
        overflow-x: auto;
        margin: 1rem 0;
      }

      .lesson-card code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.9em;
      }

      .lesson-card :not(pre) > code {
        background: var(--code-bg);
        border: 1px solid var(--border);
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }

      .lesson-card table {
        border-collapse: collapse;
        width: 100%;
        margin: 1rem 0;
      }

      .lesson-card th,
      .lesson-card td {
        border: 1px solid var(--border);
        padding: 0.5rem 0.75rem;
        text-align: left;
      }

      .lesson-card blockquote {
        border-left: 4px solid #4f46e5;
        padding-left: 1rem;
        color: var(--muted);
        margin: 1rem 0;
      }

      .status {
        color: var(--ink);
        text-align: center;
        padding: 3rem 1rem;
      }

      .status a {
        font-weight: 600;
      }

      @media (min-width: 768px) {
        .lesson-card {
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-inner">
        <a href="index.html">← 🥋 Fawkes Dojo</a>
        <a id="source-link" href="#" target="_blank" rel="noopener">View on GitHub ↗</a>
      </div>
    </div>
    <div class="container">
      <div id="lesson-card" class="lesson-card" hidden></div>
      <div id="status" class="status">Loading lesson…</div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const src = params.get("src");
      const statusEl = document.getElementById("status");
      const cardEl = document.getElementById("lesson-card");
      const sourceLink = document.getElementById("source-link");

      function showError(message) {
        statusEl.innerHTML = message;
      }

      if (!src || src.includes("..") || src.startsWith("/") || src.includes("://")) {
        showError("No valid lesson specified. <a href=\"index.html\">Return to the Dojo</a>.");
      } else {
        sourceLink.href = `https://github.com/paruff/uFawkesDojo/blob/main/${src}`;
        fetch(src)
          .then((res) => {
            if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
            return res.text();
          })
          .then((markdown) => {
            cardEl.innerHTML = marked.parse(markdown);
            cardEl.hidden = false;
            statusEl.hidden = true;
            document.title = `Fawkes Dojo - ${src.split("/").pop()}`;
          })
          .catch((err) => {
            showError(
              `Could not load this lesson (${err.message}). ` +
                `<a href="https://github.com/paruff/uFawkesDojo/blob/main/${src}" target="_blank" rel="noopener">View it on GitHub instead ↗</a>`,
            );
          });
      }
    </script>
  </body>
</html>
